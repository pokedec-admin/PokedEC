name: Keep-alive Backend (Render)

# Ping le backend toutes les 14 min pour éviter le cold start de Render.com
# Render met en veille les services gratuits après ~15 min d'inactivité

on:
  schedule:
    - cron: '*/14 * * * *'   # toutes les 14 minutes, 24h/24, 7j/7
  workflow_dispatch:          # déclenchement manuel possible

jobs:
  ping-backend:
    name: Ping Backend
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping /system/status
        run: |
          echo "⏰ $(date -u '+%Y-%m-%d %H:%M:%S UTC') — Ping du backend..."
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --max-time 40 \
            --retry 2 \
            --retry-delay 3 \
            "https://pokedec-backend.onrender.com/system/status")
          echo "📡 HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Backend is alive (HTTP $HTTP_STATUS)"
          else
            echo "⚠️  Backend a répondu avec HTTP $HTTP_STATUS (peut être en cours de démarrage)"
            # On ne fait pas échouer le job pour ne pas polluer les notifications GitHub
          fi
