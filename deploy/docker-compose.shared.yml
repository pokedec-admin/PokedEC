version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pokedec-blue-green-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - pokedec-shared-db-data:/var/lib/postgresql/data
    restart: always
    networks:
      - shared-net

networks:
  shared-net:
    name: pokedec-shared-net
    driver: bridge

volumes:
  pokedec-shared-db-data:
    name: pokedec-shared-db-data
