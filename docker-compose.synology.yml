services:
  nginx:
    container_name: pokedec-${ENV_SUFFIX:-blue}-nginx
    build: ./nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.synology.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - default
      - pokedec-shared-net

  frontend:
    container_name: pokedec-${ENV_SUFFIX:-blue}-frontend
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - ./frontend-dist/browser:/usr/share/nginx/html:ro
      - ./nginx/nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
      - /volume1/docker/pokedec-shared/images:/usr/share/nginx/html/images
    depends_on:
      - backend
    restart: always

  backend:
    container_name: pokedec-${ENV_SUFFIX:-blue}-backend
    build: ./backend
    expose:
      - "3000"
    volumes:
      - /volume1/docker/pokedec-shared/images:/frontend/public/images
      - ./frontend-dist/browser/images:/static-images:ro
    env_file:
      - .env.synology
    environment:
      - DB_HOST=pokedec-blue-green-db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=postgres
      - NODE_ENV=production
      - APP_ENV=${APP_ENV} # Injected by deploy script (BLUE / GREEN)
      - APP_VERSION=${APP_VERSION} # Injected by deploy script
    restart: always
    networks:
      - default
      - pokedec-shared-net

networks:
  pokedec-shared-net:
    external: true
